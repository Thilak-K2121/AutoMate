name: flutter_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the libraries for API and Storage
  http: ^1.1.0
  shared_preferences: ^2.2.2
  socket_io_client: ^2.0.3

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# This is the section where Flutter-specific configurations live
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/google.png

  # Bundled brand font (SIL Open Font License — see assets/fonts/OFL.txt)
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/auto_icon(1) (1).png"
  adaptive_icon_background: "#ffffff" # Keeps the background a clean white
  adaptive_icon_foreground: "assets/images/auto_icon(1) (1).png"

# Native launch screen. Uses a SQUARE logo (1152x1152, logo centred in the
# safe circle) because Android 12+ forces the splash icon into a square —
# the old 1024x1536 image was being squashed. Green matches the Flutter splash.
flutter_native_splash:
  color: "#12A150"
  image: "assets/images/splash_logo.png"
  android_12:
    image: "assets/images/splash_logo.png"
    color: "#12A150"